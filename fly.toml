app = "btcusdc-paper-forward"
primary_region = "nrt"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile.fly"

[processes]
  app = "node dist/src/trading/btcusdcRealtimeWorkerCli.js"

[env]
  NODE_ENV = "production"
  BTCUSDC_REALTIME_SYMBOL = "BTCUSDC"
  BTCUSDC_REALTIME_DISPLAY_SYMBOL = "BTCUSDC.P"
  BTCUSDC_REALTIME_INTERVAL = "1m"
  BTCUSDC_REALTIME_CANDLES_PATH = "/data/btcusdc-1m-candles.json"
  BTCUSDC_REALTIME_STATE_PATH = "/data/btcusdc-paper-state.json"
  BTCUSDC_REALTIME_LOG_PATH = "/data/btcusdc-paper-events.jsonl"
  BTCUSDC_REALTIME_WARMUP_CANDLES = "6000"
  BTCUSDC_REALTIME_MAX_CANDLES = "6000"
  BTCUSDC_STRATEGY_REGISTRY_PATH = "/data/btcusdc-strategy-registry.json"
  BTCUSDC_PAPER_INITIAL_EQUITY = "1000"
  BTCUSDC_DAILY_REPORT_AT_KST = "09:00"
  BTCUSDC_DAILY_REPORT_STATE_PATH = "/data/btcusdc-daily-report-state.json"
  BTCUSDC_TELEGRAM_REPORT_QUOTA_PATH = "/data/btcusdc-telegram-report-quota.json"
  BTCUSDC_TELEGRAM_REPORT_MAX_PER_DAY = "2"
  BTCUSDC_TELEGRAM_TRADE_ALERTS_ENABLED = "false"
  BTCUSDC_AUTO_RESEARCH_ENABLED = "true"
  BTCUSDC_CORE_RESEARCH_DAY_OF_WEEK = "1"
  BTCUSDC_CORE_RESEARCH_AT_KST = "01:20"
  BTCUSDC_CORE_RESEARCH_DAYS = "180"
  BTCUSDC_CORE_RESEARCH_MAX_CANDLES = "259200"
  BTCUSDC_CORE_RESEARCH_STATE_PATH = "/data/btcusdc-core-research-state.json"
  NODE_OPTIONS = "--max-old-space-size=384"

[[mounts]]
  source = "btcusdc_paper_data"
  destination = "/data"
  processes = ["app"]

[[restart]]
  policy = "always"
  retries = 10
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
